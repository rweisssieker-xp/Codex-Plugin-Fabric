name: CI

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/codex-plugin-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/codex-plugin-fabric/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm audit --omit=dev

